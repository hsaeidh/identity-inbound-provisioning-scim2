# This workflow will build the project on pull requests with tests
# Uses:
#   OS: ubuntu-latest
#   JDK: Adopt JDK 21

name: PR Builder

on:
  push:
    branches: [wso2-is-7.3.0-groups-fixes]
  pull_request:
    branches: [main, master, next]
  workflow_dispatch:

env:
  MAVEN_OPTS: -Xmx4g -Xms1g

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Adopt JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "adopt"
      - name: Cache local Maven repository
        id: cache-maven-m2
        uses: actions/cache@v4
        env:
          cache-name: cache-m2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ env.cache-name }}-
            ${{ runner.os }}-maven-
            ${{ runner.os }}-
      - name: Build with Maven
        run: mvn clean install -U -B

      - name: Generate coverage report
        run: mvn test jacoco:report

      - name: Upload SCIM2 common OSGi bundle
        uses: actions/upload-artifact@v4
        with:
          name: scim2-common-wso2-is-7.3.0
          path: components/org.wso2.carbon.identity.scim2.common/target/org.wso2.carbon.identity.scim2.common-3.6.17.jar
          if-no-files-found: error
          retention-days: 14

      - name: Check Codecov token availability
        id: codecov-token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CODECOV_TOKEN is not configured; skipping coverage upload."
          fi

      - name: Upload coverage reports to Codecov
        if: steps.codecov-token.outputs.available == 'true'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            components/org.wso2.carbon.identity.scim2.common/target/site/jacoco/jacoco.xml
            components/org.wso2.carbon.identity.scim2.provider/target/site/jacoco/jacoco.xml
          flags: unit
